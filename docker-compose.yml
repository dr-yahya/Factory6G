services:

  simulation:          # CPU-only (set force_cpu: true in config/config.json)
    build: .
    image: factory6g:latest
    volumes:
      - ./results:/app/results
      - ./config/config.json:/app/config/config.json:ro

  simulation-gpu:      # GPU-accelerated (set force_cpu: false in config/config.json)
    build: .
    image: factory6g:latest
    volumes:
      - ./results:/app/results
      - ./config/config.json:/app/config/config.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  test:                # Run the test suite against the live checkout
    build: .
    image: factory6g:latest
    volumes:
      - .:/app                        # bind the checkout so tests/ is present
    environment:
      CUDA_VISIBLE_DEVICES: "-1"      # the suite is CPU-only and seeds TF itself
    entrypoint: ["bash", "-lc"]
    command: ["pip install -e . -q && pytest -q"]

  visualize:           # Ray-tracing visualization of factory environments
    build: .
    image: factory6g:latest
    volumes:
      - ./results:/app/results
      - ./config/config.json:/app/config/config.json:ro
    entrypoint: ["python", "-m", "factory6g.cli.visualize"]
    command: ["--factory-size", "s,m,l,xl"]

  train-estimator:     # Train the NeuralChannelEstimator inside Docker
    build: .
    image: factory6g:latest
    volumes:
      - ./models:/app/models          # trained weights persist on host
      - ./data:/app/data              # generated dataset persists on host
      - ./config/config.json:/app/config/config.json:ro
    entrypoint: ["python", "-m", "factory6g.cli.train"]
    command: ["--data", "data/channel_train.npz", "--output", "models/neural_estimator.keras"]

  thesis:              # Build thesis/main.pdf (XeLaTeX + biber via latexmk); output under thesis/build/
    image: texlive/texlive:latest
    volumes:
      - ./thesis:/work
    working_dir: /work
    entrypoint: ["latexmk"]
    command:
      - -synctex=1
      - -interaction=nonstopmode
      - -file-line-error
      - -xelatex
      - main.tex

  # To resume an interrupted run, override the command on the existing service:
  #   CPU: docker compose run simulation --config config/config.json --resume /app/results/20260315_092517_simulation
  #   GPU: docker compose run simulation-gpu --config config/config.json --resume /app/results/20260315_092517_simulation
